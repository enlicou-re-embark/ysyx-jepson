<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B1120">
<title>Jepson 的造芯进度 · 一生一芯</title>
<meta name="description" content="从大本营走到峰顶，每点亮一格，离一颗真芯片近一点。">
<meta property="og:title" content="Jepson 的造芯进度">
<meta property="og:description" content="一生一芯 F 到 A，六段路，一格一格点亮。">
<meta property="og:type" content="website">
<style>
:root{
  --bg:#0A101C; --sf:#101A2C; --sf2:#16213A; --bd:#1D2A42; --bd2:#2A3A5C;
  --tx:#E8EFF9; --mu:#7E8EA6; --mu2:#5A6B85;
  --ac:#38BDF8; --ac2:#22D3EE; --ok:#34D399; --wn:#FBBF24; --gold:#F5A623;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--tx);
  font-family:system-ui,-apple-system,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  line-height:1.6; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
.wrap{max-width:900px;margin:0 auto;padding:0 18px}

/* ---------- 首页：山体 ---------- */
.hero{padding:26px 0 6px}
.hero h1{font-size:19px;font-weight:600;letter-spacing:.4px}
.hero .sub{font-size:12.5px;color:var(--mu);margin-top:5px;line-height:1.55}

.mt-outer{position:relative;margin-top:16px}
.mt-scroll{
  overflow-x:auto; overflow-y:hidden;
  -webkit-overflow-scrolling:touch; scrollbar-width:none;
  border-radius:14px;
}
.mt-scroll::-webkit-scrollbar{display:none}
.mt-canvas{position:relative;display:inline-block;line-height:0;width:100%}
.mt-canvas img{width:100%;height:auto;display:block;border-radius:14px}
.mt-scroll{background:linear-gradient(180deg,#132038,#0B1524);border-radius:14px}

.hot{
  position:absolute; transform:translate(-50%,-50%);
  width:42px;height:42px;border-radius:50%;
  border:none;background:transparent;cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;
  z-index:3;
}
.hot i{
  display:block;width:20px;height:20px;border-radius:50%;
  background:rgba(8,14,24,.5);
  border:2.5px solid #FFC85C;
  box-shadow:0 0 0 2px rgba(6,10,18,.55), 0 0 13px rgba(255,190,60,.75);
  transition:.22s;
}
.hot b{
  position:absolute; top:50%; left:calc(50% + 13px); transform:translateY(-50%);
  font-size:11px;font-weight:700;letter-spacing:.6px;line-height:1;
  color:#FFD98A;background:rgba(7,12,22,.8);
  padding:3px 7px;border-radius:6px;
  border:1px solid rgba(255,200,90,.32);
  white-space:nowrap;pointer-events:none;
}
.hot.l b{left:auto;right:calc(50% + 13px)}
.hot:hover i,.hot:focus-visible i{transform:scale(1.5);background:var(--gold);box-shadow:0 0 0 4px rgba(245,166,35,.28),0 0 20px rgba(245,166,35,.8)}
.hot.done i{background:var(--gold);box-shadow:0 0 0 3px rgba(245,166,35,.3),0 0 16px rgba(245,166,35,.65)}
.hot.cur i{animation:pulse 2.1s ease-in-out infinite}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 3px rgba(245,166,35,.18),0 0 12px rgba(245,166,35,.4)}
  50%{box-shadow:0 0 0 7px rgba(245,166,35,.05),0 0 22px rgba(245,166,35,.85)}
}
.mt-outer .hint-swipe{
  position:absolute;right:10px;bottom:8px;font-size:10px;line-height:1.4;color:rgba(255,255,255,.55);
  background:rgba(6,10,18,.6);padding:3px 8px;border-radius:99px;
  pointer-events:none;z-index:4;
}
@media (min-width:760px){ .mt-outer .hint-swipe{display:none} }

/* 手机：图撑到一定高度，超出部分横向拖动 */
@media (max-width:759px){
  .mt-canvas{width:auto}
  .mt-canvas img{width:auto;height:58vh;max-height:440px;border-radius:14px}
  .mt-scroll{border-radius:14px}
}

/* ---------- 进度条 ---------- */
.bar-wrap{margin-top:18px}
.bar-meta{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--mu);margin-bottom:7px}
.bar-meta b{color:var(--tx);font-weight:600;font-size:13px}
.bar{height:5px;background:var(--sf2);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;width:0;background:linear-gradient(90deg,#0E7490,var(--ac2));border-radius:99px;transition:width .55s cubic-bezier(.4,0,.2,1)}

/* ---------- 通用 ---------- */
section{padding:26px 0 0}
h2{font-size:12px;font-weight:600;color:var(--mu);letter-spacing:1.6px;text-transform:uppercase;margin-bottom:12px}
h2 span{color:var(--tx);font-weight:600;letter-spacing:.3px;text-transform:none;font-size:14px;margin-left:7px}

.today{display:grid;gap:9px}
.tcard{
  background:var(--sf);border:1px solid var(--bd);border-radius:13px;
  padding:14px 16px;cursor:pointer;transition:.16s;
  display:flex;gap:12px;align-items:flex-start;
}
.tcard:hover{border-color:var(--bd2);background:var(--sf2)}
.tcard .idx{
  flex:0 0 24px;height:24px;border-radius:7px;background:#0C2A38;color:var(--ac2);
  display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;
}
.tcard .body{flex:1;min-width:0}
.tcard .st{font-size:10.5px;color:var(--ac2);letter-spacing:.6px;margin-bottom:2px}
.tcard .tt{font-size:13.5px;font-weight:500;line-height:1.45}
.tcard .ds{font-size:11.5px;color:var(--mu);margin-top:3px;line-height:1.45}

/* ---------- 阶段页 ---------- */
#stageView{display:none}
#stageView.on{display:block}
#homeView.off{display:none}

.back{
  display:inline-flex;align-items:center;gap:6px;
  background:none;border:none;color:var(--mu);font-size:13px;
  cursor:pointer;padding:16px 0 4px;font-family:inherit;
}
.back:hover{color:var(--tx)}

.st-hd{padding:6px 0 20px}
.st-hd .tag{font-size:11px;color:var(--ac2);letter-spacing:1.4px;margin-bottom:6px}
.st-hd h1{font-size:23px;font-weight:600;letter-spacing:.3px}
.st-hd .meta{font-size:12.5px;color:var(--mu);margin-top:7px;line-height:1.6}

/* 海拔条 */
.alt{position:relative;margin:22px 0 8px;height:44px}
.alt-track{
  position:absolute;left:0;right:0;top:20px;height:4px;border-radius:99px;
  background:linear-gradient(90deg,#1B3A4B,#164E63 35%,#0E7490 70%,#F5A623);
  opacity:.55;
}
.alt-mark{
  position:absolute;top:20px;width:2px;height:4px;background:var(--bd2);
}
.alt-dot{
  position:absolute;top:22px;width:9px;height:9px;border-radius:50%;
  transform:translate(-50%,-50%);background:var(--sf2);border:1.5px solid var(--bd2);
}
.alt-dot.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 10px rgba(245,166,35,.7)}
.alt-lbl{
  position:absolute;top:4px;transform:translateX(-50%);
  font-size:10px;color:var(--mu2);letter-spacing:.5px;
}
.alt-lbl.on{color:var(--gold);font-weight:600}
.alt-pos{position:absolute;right:0;top:34px;font-size:10px;color:var(--mu2);display:none}

/* 节点列表 */
.list{display:grid;gap:8px;margin-top:8px}
.item{
  background:var(--sf);border:1px solid var(--bd);border-radius:12px;
  padding:13px 15px;cursor:pointer;transition:.16s;
  display:flex;gap:12px;align-items:flex-start;
}
.item:hover{border-color:var(--bd2);background:var(--sf2)}
.item.done{opacity:.55}
.item.done .it-t{text-decoration:line-through;text-decoration-color:var(--mu2)}
.it-n{
  flex:0 0 26px;height:26px;border-radius:8px;background:var(--sf2);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:var(--mu);
}
.item.done .it-n{background:#0F2E24;color:var(--ok)}
.it-b{flex:1;min-width:0}
.it-t{font-size:13.5px;font-weight:500;line-height:1.45}
.it-d{font-size:11.5px;color:var(--mu);margin-top:3px;line-height:1.45}
.chip{display:inline-block;font-size:10px;padding:1px 7px;border-radius:5px;background:#0C2A38;color:var(--ac2);margin-top:6px;letter-spacing:.3px}
.chip.warn{background:#2E2410;color:var(--wn)}

/* ---------- 弹层 ---------- */
#modal{
  position:fixed;inset:0;background:rgba(4,8,15,.84);backdrop-filter:blur(7px);
  display:none;align-items:flex-end;justify-content:center;z-index:99;
  padding:0;
}
#modal.on{display:flex}
@media (min-width:640px){ #modal{align-items:center;padding:24px} }
.sheet{
  background:var(--sf);border:1px solid var(--bd);
  border-radius:20px 20px 0 0;
  width:100%;max-width:540px;max-height:88vh;overflow-y:auto;
  padding:24px 22px calc(24px + env(safe-area-inset-bottom));
  animation:up .26s cubic-bezier(.2,.8,.3,1);
}
@media (min-width:640px){ .sheet{border-radius:18px} }
@keyframes up{from{transform:translateY(26px);opacity:0}to{transform:none;opacity:1}}
.grab{width:34px;height:4px;border-radius:99px;background:var(--bd2);margin:-8px auto 14px}
.sheet-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-hd h3{font-size:16.5px;font-weight:600;line-height:1.4}
.close{background:none;border:none;color:var(--mu);font-size:24px;cursor:pointer;padding:0 2px;line-height:1}
.sheet .stag{font-size:10.5px;color:var(--ac2);letter-spacing:1.1px;margin-top:6px}
.block{margin-top:18px}
.block .lb{font-size:10.5px;color:var(--mu);letter-spacing:1.2px;margin-bottom:6px}
.block .val{font-size:13.5px;line-height:1.65}
.block .val.out{background:#0C2A38;border-left:2px solid var(--ac2);padding:9px 13px;border-radius:0 8px 8px 0}
.block .val.stuck{color:var(--wn);font-size:12.5px}

/* ---------- 交付区 ---------- */
.att-cnt{float:right;font-size:10.5px;font-weight:600;color:var(--mu2);letter-spacing:0}
.att-cnt.all{color:var(--ok)}
.att-i{
  border:1px dashed var(--bd2);border-radius:10px;
  padding:10px 12px;margin-bottom:9px;background:rgba(255,255,255,.015);
}
.att-i.ok{border-style:solid;border-color:rgba(52,211,153,.28);background:rgba(52,211,153,.05)}
.att-top{display:flex;align-items:center;gap:7px}
.att-top i{width:7px;height:7px;border-radius:50%;background:var(--mu2);flex:none}
.att-i.ok .att-top i{background:var(--ok);box-shadow:0 0 8px rgba(52,211,153,.7)}
.att-t{font-size:13px;line-height:1.5;flex:1;min-width:0}
.att-ok{font-size:10px;color:var(--ok);letter-spacing:.5px;flex:none}
.att-h{font-size:11px;color:var(--mu2);margin:4px 0 0 14px;line-height:1.5}
.att-act{display:flex;gap:6px;margin-top:9px;padding-left:14px;flex-wrap:wrap}
.att-act button{
  font:inherit;font-size:11.5px;color:var(--ac2);
  background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.22);
  border-radius:7px;padding:5px 10px;cursor:pointer;
}
.att-act button:hover{background:rgba(34,211,238,.16)}
.att-have{display:flex;align-items:center;gap:8px;margin-top:8px;padding-left:14px;font-size:11.5px;color:var(--mu)}
.att-have .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx)}
.att-have .sz{flex:none;font-size:10.5px;color:var(--mu2)}
.att-have a.fn{color:var(--ac2);text-decoration:underline}
.att-tx{display:block;line-height:1.55;color:var(--mu);white-space:pre-wrap}
.att-x{
  flex:none;font:inherit;font-size:10.5px;color:var(--mu2);
  background:none;border:1px solid var(--bd2);border-radius:5px;
  padding:2px 7px;cursor:pointer;
}
.att-x:hover{color:#F87171;border-color:rgba(248,113,113,.4)}
.att-thumb{margin:8px 0 0 14px}
.att-thumb img{max-width:100%;max-height:220px;border-radius:8px;display:block;border:1px solid var(--bd)}
.att-empty{font-size:12px;color:var(--mu2);line-height:1.6;padding:2px 0 4px}
.att-free{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.att-free button{
  font:inherit;font-size:11.5px;color:var(--mu);
  background:transparent;border:1px dashed var(--bd2);
  border-radius:7px;padding:6px 11px;cursor:pointer;
}
.att-free button:hover{color:var(--ac2);border-color:var(--ac2)}

/* 二级输入层：贴链接 / 写一段 */
.attbox{
  position:fixed;inset:0;z-index:60;background:rgba(4,8,16,.78);
  display:none;align-items:center;justify-content:center;padding:24px;
}
.attbox.on{display:flex}
.attbox-in{width:100%;max-width:440px;background:var(--sf);border:1px solid var(--bd2);border-radius:14px;padding:18px}
.attbox-in h4{font-size:14px;font-weight:600;margin-bottom:12px}
.attbox-in input,.attbox-in textarea{
  width:100%;font:inherit;font-size:13px;color:var(--tx);
  background:var(--sf2);border:1px solid var(--bd2);border-radius:9px;
  padding:10px 12px;outline:none;resize:vertical;
}
.attbox-in input:focus,.attbox-in textarea:focus{border-color:var(--ac2)}
.attbox-act{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.attbox-act button{
  font:inherit;font-size:12.5px;padding:8px 16px;border-radius:8px;cursor:pointer;
  background:var(--sf2);border:1px solid var(--bd2);color:var(--mu);
}
.attbox-act button.main{background:var(--ac2);border-color:var(--ac2);color:#04121A;font-weight:600}
textarea{
  width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:10px;
  color:var(--tx);padding:10px 12px;font-size:13px;font-family:inherit;
  resize:vertical;min-height:60px;margin-top:6px;line-height:1.6;
}
textarea:focus{outline:none;border-color:var(--ac2)}
textarea::placeholder{color:#3F5170}
.btn{
  border:none;border-radius:11px;padding:13px 20px;font-size:13.5px;font-weight:500;
  cursor:pointer;font-family:inherit;transition:.16s;width:100%;margin-top:14px;
}
.btn-main{background:var(--ac2);color:#04262E}
.btn-main:hover{background:#67E8F9}
.btn-done{background:#0F2E24;color:var(--ok);border:1px solid #1A4A3C}
.btn-ghost{background:transparent;color:var(--mu);border:1px solid var(--bd);width:auto;padding:8px 13px;font-size:11.5px;margin-top:0}
.btn-ghost:hover{color:var(--tx);border-color:var(--bd2)}
.note-done{font-size:12px;color:var(--ok);margin-top:12px;display:flex;gap:6px;align-items:center}
.note-done::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--ok)}

footer{border-top:1px solid var(--bd);margin-top:34px;padding:18px 0 30px;display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:11px;color:var(--mu2);line-height:1.75;margin-top:14px;padding-bottom:26px}

.toast{
  position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(12px);
  background:#152238;border:1px solid var(--bd2);color:var(--tx);
  padding:10px 18px;border-radius:11px;font-size:12.5px;z-index:200;
  opacity:0;pointer-events:none;transition:.24s;white-space:nowrap;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- 里程碑弹句 ---------- */
.cheer{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(22px) scale(.97);
  width:calc(100% - 40px);max-width:440px;z-index:210;
  opacity:0;pointer-events:none;transition:.34s cubic-bezier(.22,1.2,.36,1);
}
.cheer.on{opacity:1;transform:translateX(-50%) translateY(0) scale(1);pointer-events:auto}
.cheer-in{
  position:relative;overflow:hidden;
  background:linear-gradient(150deg,#1A2233,#101724 62%);
  border:1px solid rgba(245,166,35,.34);
  border-radius:15px;padding:15px 17px 15px 18px;
  box-shadow:0 16px 44px rgba(0,0,0,.62),0 0 0 1px rgba(245,166,35,.06),inset 0 1px 0 rgba(255,255,255,.05);
}
.cheer-in::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,#F5A623,#FFD98A);opacity:.9;
}
.cheer-in::after{
  content:'';position:absolute;right:-40px;top:-50px;width:130px;height:130px;border-radius:50%;
  background:radial-gradient(circle,rgba(245,166,35,.13),transparent 70%);pointer-events:none;
}
.cheer-tag{
  font-size:10px;letter-spacing:1.4px;color:#E0A34A;font-weight:700;
  text-transform:uppercase;margin-bottom:7px;
}
.cheer-tx{font-size:13.5px;line-height:1.72;color:#EAF0F8;letter-spacing:.2px}
.cheer-close{
  position:absolute;right:6px;top:6px;width:26px;height:26px;border:none;border-radius:8px;
  background:transparent;color:#7C8CA6;font-size:15px;line-height:1;cursor:pointer;
}
.cheer-close:hover{background:rgba(255,255,255,.06);color:#C6D3E5}
@media (max-width:480px){
  .cheer{bottom:20px;width:calc(100% - 28px)}
  .cheer-tx{font-size:13px}
}
</style>

<body>

<div class="wrap" id="homeView">
  <div class="hero">
    <h1>Jepson 的造芯进度</h1>
    <div class="sub">从大本营走到峰顶。每点亮一格，离一颗真芯片近一点。</div>
  </div>

  <div class="mt-outer">
    <div class="mt-scroll" id="mtScroll">
      <div class="mt-canvas" id="mtCanvas">
        <picture>
          <source type="image/webp" media="(max-width:860px)" srcset="route-s.cf919ce1.webp">
          <source type="image/webp" srcset="route-l.cf919ce1.webp">
          <source media="(max-width:860px)" srcset="route-s.cf919ce1.jpg">
          <img src="route-l.cf919ce1.jpg" alt="珠峰路线图" id="mtImg" width="1400" height="603" fetchpriority="high">
        </picture>
      </div>
    </div>
    <div class="hint-swipe">← 左右拖动 →</div>
  </div>

  <div class="bar-wrap">
    <div class="bar-meta">
      <span id="progText">0 / 0</span>
      <b id="progPct">0%</b>
    </div>
    <div class="bar"><div class="bar-fill" id="progBar"></div></div>
  </div>

  <section>
    <h2>今天可以做的<span>三件</span></h2>
    <div class="today" id="today"></div>
  </section>

  <section>
    <h2>六个阶段<span id="stageCount"></span></h2>
    <div class="list" id="stageList"></div>
  </section>

  <footer>
    <button class="btn-ghost" onclick="exportJSON()">备份到文件</button>
    <button class="btn-ghost" onclick="document.getElementById('imp').click()">从文件恢复</button>
    <button class="btn-ghost" onclick="exportReport()">导出进度报告</button>
    <button class="btn-ghost" onclick="copyShare()">复制一句话发群里</button>
    <button class="btn-ghost" style="margin-left:auto" onclick="resetAll()">清空</button>
    <input type="file" id="imp" accept=".json" style="display:none" onchange="importJSON(this)">
  </footer>
  <div class="hint">
    进度和你交的图，都存在这台设备的浏览器里，换设备不会自动同步。要换设备，先用「备份到文件」导出，再到新设备「从文件恢复」。<br>
    浏览器里的东西可能因为清缓存丢掉。真正要紧的，自己在电脑上再留一份，按编号命名，比如 F3-04.png。
  </div>
</div>

<div class="wrap" id="stageView">
  <button class="back" onclick="go('')">← 回到路线</button>
  <div id="stageBody"></div>
</div>

<div id="modal" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>

<div id="attBox" class="attbox" onclick="if(event.target===this)closeAttBox()">
  <div class="attbox-in">
    <h4 id="attBoxTitle"></h4>
    <div id="attBoxBody"></div>
    <div class="attbox-act">
      <button onclick="closeAttBox()">取消</button>
      <button class="main" onclick="saveAttBox()">存下</button>
    </div>
  </div>
</div>

<input type="file" id="attFile" style="display:none" accept="image/*,video/*,.pdf,.txt,.md,.doc,.docx,.zip,.rar">

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   数据层：与界面分离，将来换云端只动 Store 一个对象
   ------------------------------------------------------------
   现在：localStorage
   将来：把 Store.init / Store.persist 换成 Supabase 调用即可，
        所有 UI 都已经是 await 调用，调用点不用改。
   ============================================================ */
const SCHEMA = 2;
const KEY = 'ysyx_progress_v1';

/* ------------------------------------------------------------
   文件层：图片/文档本体放 IndexedDB，元信息放 localStorage
   localStorage 只有 5MB，塞不下图片，所以拆开存。
   ------------------------------------------------------------ */
const Files = {
  db: null,
  open(){
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const req = indexedDB.open('ysyx_files', 1);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('blobs')) db.createObjectStore('blobs');
      };
      req.onsuccess = e => { this.db = e.target.result; res(this.db) };
      req.onerror = () => rej(req.error);
    });
  },
  async put(id, blob){
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction('blobs', 'readwrite');
      tx.objectStore('blobs').put(blob, id);
      tx.oncomplete = () => res(true);
      tx.onerror = () => rej(tx.error);
    });
  },
  async get(id){
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction('blobs', 'readonly');
      const r = tx.objectStore('blobs').get(id);
      r.onsuccess = () => res(r.result || null);
      r.onerror = () => rej(r.error);
    });
  },
  async del(id){
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction('blobs', 'readwrite');
      tx.objectStore('blobs').delete(id);
      tx.oncomplete = () => res(true);
      tx.onerror = () => rej(tx.error);
    });
  }
};

const Store = {
  backend: 'local',          // 'local' | 'cloud'，将来切云时改这里
  data: {},
  listeners: [],

  async init(){
    if (this.backend === 'cloud') {
      // 预留：this.data = await Cloud.load()
    }
    try {
      const raw = localStorage.getItem(KEY);
      const parsed = raw ? JSON.parse(raw) : null;
      if (!parsed) { this.data = {}; return }
      /* 迁移：v1 只有 done/note/at，v2 多一个 atts。
         这里不做 schema 严格比对，老数据一律接进来，缺的字段补默认值。 */
      const cells = parsed.cells || {};
      this.data = {};
      for (const k in cells){
        const v = cells[k];
        if (!v) continue;
        this.data[k] = { done: !!v.done, note: v.note || '', at: v.at || '', atts: v.atts || {} };
      }
    } catch(e) { this.data = {}; }
  },

  /* 唯一的写入口：将来云端在这里发请求，失败可回滚 */
  async persist(){
    const payload = { schema: SCHEMA, updatedAt: new Date().toISOString(), cells: this.data };
    if (this.backend === 'cloud') {
      // 预留：await Cloud.save(payload)
    }
    try { localStorage.setItem(KEY, JSON.stringify(payload)); } catch(e){}
    this.listeners.forEach(fn => fn());
  },

  get(id){ return this.data[id] || null },
  isDone(id){ return !!this.data[id]?.done },
  note(id){ return this.data[id]?.note || '' },
  atts(id){ return this.data[id]?.atts || {} },
  att(id, itemId){ return this.data[id]?.atts?.[itemId] || null },

  rec(id){
    if (!this.data[id]) this.data[id] = { done:false, note:'', at:'', atts:{} };
    const r = this.data[id];
    if (!r.atts) r.atts = {};
    if (r.note === undefined) r.note = '';
    return r;
  },

  async setDone(id, done, note){
    const r = this.rec(id);
    r.done = !!done;
    if (note !== undefined) r.note = note;
    if (done && !r.at) r.at = today();
    await this.persist();          // 注意：取消点亮只关灯，不删笔记和附件
  },

  async setNote(id, note){
    const r = this.rec(id);
    r.note = note;
    await this.persist();
  },

  /* ---- 交付物：三种形态共用一套槽位 ---- */
  async addFile(id, itemId, file){
    const attId = 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    await Files.put(attId, file);
    const r = this.rec(id);
    const old = r.atts[itemId];
    if (old && old.attId) { try { await Files.del(old.attId) } catch(e){} }
    r.atts[itemId] = { attId, kind:'file', name:file.name, mime:file.type || '', size:file.size, at:today() };
    await this.persist();
    return r.atts[itemId];
  },

  async addLink(id, itemId, url){
    const r = this.rec(id);
    r.atts[itemId] = { attId:null, kind:'link', url, name:url, at:today() };
    await this.persist();
  },

  async addText(id, itemId, text){
    const r = this.rec(id);
    r.atts[itemId] = { attId:null, kind:'text', text, name:'', at:today() };
    await this.persist();
  },

  async delAtt(id, itemId){
    const r = this.data[id];
    if (!r || !r.atts || !r.atts[itemId]) return;
    const a = r.atts[itemId];
    if (a.attId) { try { await Files.del(a.attId) } catch(e){} }
    delete r.atts[itemId];
    await this.persist();
  },

  dump(){ return { schema: SCHEMA, updatedAt: new Date().toISOString(), cells: this.data } },

  async clearAll(){
    this.data = {};
    try { localStorage.removeItem(KEY); } catch(e){}
    this.listeners.forEach(fn => fn());
  },

  async load(obj){
    if (!obj || typeof obj !== 'object') throw new Error('bad file');
    const cells = obj.cells || obj;
    this.data = {};
    for (const k in cells){
      const v = cells[k];
      if (!v) continue;
      if (v.done || v.note || (v.atts && Object.keys(v.atts).length)){
        this.data[k] = { done: !!v.done, note: v.note || '', at: v.at || '', atts: v.atts || {} };
      }
    }
    await this.persist();
  }
};

/* 判断这次点亮踩到了哪个节点，返回 key 或 null
   档位按格数算死，不用百分比区间，避免小阶段两档撞在一起 */
function milestoneHit(stage, before, after){
  const n = stage.cells.length;
  if (!n || after <= before) return null;
  const t30 = Math.max(2, Math.ceil(n * 0.3));
  const t80 = Math.min(n - 1, Math.max(t30 + 1, Math.ceil(n * 0.8)));
  if (after === n) return 'p100';
  if (after === 1) return 'first';        // 第一格单独一句话
  if (after === t80) return 'p80';
  if (after === t30) return 'p30';
  return null;
}
function esc(s){ return String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])) }

function renderHome(){
  // 热区
  const canvas = document.getElementById('mtCanvas');
  canvas.querySelectorAll('.hot').forEach(n => n.remove());
  STAGES.forEach(s => {
    const doneN = countDone(s.cells);
    const isDone = doneN === s.cells.length;
    const isCur = currentStage()?.id === s.id;
    const btn = document.createElement('button');
    btn.className = 'hot' + (isDone ? ' done' : '') + (isCur ? ' cur' : '') + (s.side === 'l' ? ' l' : '');
    btn.style.left = s.x + '%';
    btn.style.top = s.y + '%';
    btn.setAttribute('aria-label', s.name);
    btn.dataset.id = s.id;
    btn.innerHTML = '<i></i><b>' + s.short + '</b>';
    btn.onclick = () => go(s.id);
    canvas.appendChild(btn);
  });

  // 总进度
  const done = countDone(ALL), total = ALL.length;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('progText').textContent = done + ' / ' + total + ' 格';
  document.getElementById('progPct').textContent = pct + '%';
  document.getElementById('progBar').style.width = pct + '%';

  // 今天三件
  const curStage = currentStage();
  const picks = curStage ? curStage.cells.filter(c => !Store.isDone(c.id)).slice(0, 3) : [];
  const todayEl = document.getElementById('today');
  if (!picks.length){
    todayEl.innerHTML = '<div class="tcard" style="cursor:default"><div class="body">' +
      '<div class="tt">F 到 A 的格子都点亮了。</div>' +
      '<div class="ds">下一步是准备入学答辩。找社团群里的助教要清单。</div></div></div>';
  } else {
    todayEl.innerHTML = picks.map((c, i) =>
      '<div class="tcard" onclick="openSheet(\'' + c.id + '\')">' +
        '<div class="idx">' + (i+1) + '</div>' +
        '<div class="body"><div class="st">' + curStage.id + '</div>' +
        '<div class="tt">' + esc(c.t) + '</div>' +
        '<div class="ds">交：' + esc(c.out) + '</div></div></div>'
    ).join('');
  }

  // 阶段列表
  const sl = document.getElementById('stageList');
  sl.innerHTML = STAGES.map(s => {
    const d = countDone(s.cells), n = s.cells.length;
    const isCur = curStage?.id === s.id;
    return '<div class="item' + (d === n ? ' done' : '') + '" onclick="go(\'' + s.id + '\')">' +
      '<div class="it-n"' + (isCur ? ' style="background:#12283B;color:#38BDF8"' : '') + '>' + s.short + '</div>' +
      '<div class="it-b"><div class="it-t">' + esc(s.desc) + '</div>' +
      '<span class="chip">' + d + ' / ' + n + '</span>' +
      '<span class="chip" style="margin-left:6px">' + s.hours + '</span></div></div>';
  }).join('');
}

function go(id){
  if (id){
    location.hash = '#/' + id;
  } else {
    location.hash = '';
  }
}
function onRoute(){
  const m = location.hash.match(/^#\/([A-Z])$/);
  if (m){
    document.getElementById('homeView').classList.add('off');
    document.getElementById('stageView').classList.add('on');
    renderStage(m[1]);
    window.scrollTo(0, 0);
  } else {
    document.getElementById('stageView').classList.remove('on');
    document.getElementById('homeView').classList.remove('off');
    renderHome();
  }
}

    '<div class="block"><div class="lb">这一步做什么</div><div class="val">' + esc(c.d) + '</div></div>' +
    '<div class="block"><div class="lb">交什么才算过</div><div class="val out">' + esc(c.out) + '</div></div>' +
    '<div class="block"><div class="lb">大概要多久</div><div class="val">' + (c.min ? '约 ' + c.min + ' 分钟' : '待定') + '</div></div>' +
    '<div class="block"><div class="lb">卡住了怎么过</div><div class="val stuck">' + esc(c.stuck) + '</div></div>' +
    attBlock +
    '<div class="block"><div class="lb">留一句给自己（可选）</div>' +
    '<textarea id="note" placeholder="哪一步最费劲、下次怎么绕过、想吐槽什么">' + esc(nt) + '</textarea></div>' +
    (done
      ? '<div class="note-done">这格已经点亮了' + (rec?.at ? ' · ' + rec.at : '') + '</div>' +
        '<button class="btn btn-done" onclick="toggleDone(\'' + id + '\', true)">取消点亮</button>'
      : '<button class="btn btn-main" onclick="toggleDone(\'' + id + '\', false)">点亮这一格</button>');
  document.getElementById('modal').classList.add('on');
  document.body.style.overflow = 'hidden';
  paintThumbs(id);
}

function closeSheet(){
  document.getElementById('modal').classList.remove('on');
  document.body.style.overflow = '';
  sheetId = null;
}

/* ---------- 交付区渲染 ---------- */
function attItemHtml(cellId, it){
  const a = Store.att(cellId, it.id);
  const label = it.t || (a && a.name) || '产出物';
  let acts = '', body = '';

  if (a){
    if (a.kind === 'file'){
      const isImg = (a.mime || '').indexOf('image/') === 0;
      body =
        (isImg ? '<div class="att-thumb" id="th_' + it.id + '">载入中…</div>' : '') +
        '<div class="att-have"><span class="fn">' + esc(a.name) + '</span>' +
        '<span class="sz">' + fmtSize(a.size) + '</span>' +
        '<button class="att-x" onclick="delAtt(\'' + cellId + '\',\'' + it.id + '\')">删</button></div>';
    } else if (a.kind === 'link'){
      body = '<div class="att-have"><a class="fn" href="' + esc(a.url) + '" target="_blank" rel="noopener">' +
        esc(a.url) + '</a>' +
        '<button class="att-x" onclick="delAtt(\'' + cellId + '\',\'' + it.id + '\')">删</button></div>';
    } else {
      const tx = a.text || '';
      body = '<div class="att-have att-tx">' + esc(tx.slice(0, 140)) + (tx.length > 140 ? '…' : '') +
        '<button class="att-x" onclick="delAtt(\'' + cellId + '\',\'' + it.id + '\')">删</button></div>';
    }
  } else {
    acts = '<div class="att-act">' +
      '<button onclick="pickFor(\'' + cellId + '\',\'' + it.id + '\')">上传文件</button>' +
      '<button onclick="openAttBox(\'' + cellId + '\',\'' + it.id + '\',\'link\')">贴链接</button>' +
      '<button onclick="openAttBox(\'' + cellId + '\',\'' + it.id + '\',\'text\')">写一段</button>' +
      '</div>';
  }

  return '<div class="att-i' + (a ? ' ok' : '') + '">' +
    '<div class="att-top"><i></i><span class="att-t">' + esc(label) + '</span>' +
    (a ? '<span class="att-ok">已交</span>' : '') + '</div>' +
    (it.h ? '<div class="att-h">' + esc(it.h) + '</div>' : '') +
    acts + body + '</div>';
}

async function paintThumbs(cellId){
  const atts = Store.atts(cellId);
  for (const itemId in atts){
    const a = atts[itemId];
    if (!a.attId || (a.mime || '').indexOf('image/') !== 0) continue;
    const box = document.getElementById('th_' + itemId);
    if (!box || box.dataset.on) continue;
    box.dataset.on = '1';
    try {
      const blob = await Files.get(a.attId);
      if (!blob) { box.textContent = '图片找不到了'; continue }
      const url = URL.createObjectURL(blob);
      box.innerHTML = '<img src="' + url + '" alt="">';
    } catch(e){ box.textContent = '图片读不出来' }
  }
}

/* 重渲染前先把正在写的那句笔记存住，不然会被冲掉 */
function saveNoteNow(){
  const el = document.getElementById('note');
  if (el && sheetId) Store.setNote(sheetId, el.value);
}

function fmtSize(n){
  if (n === undefined || n === null) return '';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return Math.round(n / 1024) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}

/* ---------- 交东西 ---------- */
function pickFor(cellId, itemId){
  saveNoteNow();
  attTarget = { cellId, itemId };
  const inp = document.getElementById('attFile');
  inp.value = '';
  inp.click();
}

function freeAdd(cellId, mode){
  const r = Store.rec(cellId);
  let n = 1;
  while (r.atts['_f' + n]) n++;
  const itemId = '_f' + n;
  if (mode === 'file') pickFor(cellId, itemId);
  else openAttBox(cellId, itemId, mode);
}

function openAttBox(cellId, itemId, mode){
  saveNoteNow();
  attBoxState = { cellId, itemId, mode };
  document.getElementById('attBoxTitle').textContent = mode === 'link' ? '贴个链接' : '写一段';
  document.getElementById('attBoxBody').innerHTML = mode === 'link'
    ? '<input type="url" id="attInput" placeholder="https://…" inputmode="url">'
    : '<textarea id="attInput" rows="6" placeholder="直接写，不用讲究措辞"></textarea>';
  document.getElementById('attBox').classList.add('on');
  setTimeout(() => document.getElementById('attInput')?.focus(), 80);
}

function closeAttBox(){
  document.getElementById('attBox').classList.remove('on');
  attBoxState = null;
}

async function saveAttBox(){
  if (!attBoxState) return;
  const el = document.getElementById('attInput');
  const v = (el && el.value ? el.value : '').trim();
  const st = attBoxState;
  if (!v){ toast('还没写东西'); return }
  if (st.mode === 'link' && !/^https?:\/\//i.test(v)){ toast('链接要以 http:// 或 https:// 开头'); return }
  if (st.mode === 'link') await Store.addLink(st.cellId, st.itemId, v);
  else await Store.addText(st.cellId, st.itemId, v);
  closeAttBox();
  openSheet(st.cellId);
  toast('已交');
}

async function delAtt(cellId, itemId){
  saveNoteNow();
  await Store.delAtt(cellId, itemId);
  openSheet(cellId);
  toast('已删除');
}
async function toggleDone(id, wasDone){
  const noteEl = document.getElementById('note');
  const note = noteEl ? noteEl.value.trim() : '';
  const st = stageOf(id);
  const before = st ? countDone(st.cells) : 0;

  /* 必交项没交全也允许先点亮，但要说一声——不拦人，只提醒 */
  if (!wasDone){
    const c = ALL.find(x => x.id === id);
    if (c && c.items && c.items.length){
      const miss = c.items.filter(it => !Store.att(id, it.id)).length;
      if (miss > 0 && !confirm('还有 ' + miss + ' 项没交。现在点亮也行，之后随时能回来补。要继续吗？')) return;
    }
  }

  await Store.setDone(id, !wasDone, note);
  closeSheet();
  onRoute();
  if (wasDone){ toast('已取消点亮'); return }
  const after = st ? countDone(st.cells) : 0;
  const key = st ? milestoneHit(st, before, after) : null;
  const msg = key ? (MILESTONE[st.id] || {})[key] : null;
  if (msg){
    showCheer(st.id + ' 段 · ' + MS_LABEL[key], msg);
  } else {
    toast('点亮了');
  }
}

/* ============================================================
   导入导出
   ============================================================ */
function blobToDataURL(blob){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = rej;
    fr.readAsDataURL(blob);
  });
}

function dataURLtoBlob(du){
  const i = du.indexOf(',');
  const head = du.slice(0, i), body = du.slice(i + 1);
  const m = head.match(/:(.*?);/);
  const mime = m ? m[1] : 'application/octet-stream';
  const bin = atob(body);
  const arr = new Uint8Array(bin.length);
  for (let k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
  return new Blob([arr], { type: mime });
}

/* 备份：连图片本体一起打包，换设备能完整搬过去 */
async function exportJSON(){
  toast('正在打包…');
  const payload = Store.dump();
  const blobs = {};
  let n = 0;
  for (const cellId in payload.cells){
    const atts = payload.cells[cellId].atts || {};
    for (const itemId in atts){
      const a = atts[itemId];
      if (!a.attId) continue;
      try {
        const b = await Files.get(a.attId);
        if (b){ blobs[a.attId] = await blobToDataURL(b); n++ }
      } catch(e){}
    }
  }
  payload.blobs = blobs;

  const blob = new Blob([JSON.stringify(payload)], {type:'application/json'});
  const a = document.createElement('a');
  const d = new Date();
  const name = 'Jepson造芯进度_' + d.getFullYear() + ('0'+(d.getMonth()+1)).slice(-2) + ('0'+d.getDate()).slice(-2) + '.json';
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast('已导出：' + name + (n ? '（含 ' + n + ' 个文件）' : ''));
}

async function importJSON(input){
  const f = input.files[0];
  if (!f) return;
  try {
    const obj = JSON.parse(await f.text());
    if (obj.blobs){
      for (const id in obj.blobs){
        try { await Files.put(id, dataURLtoBlob(obj.blobs[id])) } catch(e){}
      }
      delete obj.blobs;
    }
    await Store.load(obj);
    onRoute();
    toast('已恢复进度');
  } catch(e){
    toast('这个文件读不出来');
  }
  input.value = '';
}

   导出进度报告：给家长/助教看的一份 HTML，图片全部内联，
   双击就能打开，不用联网。样式先朴素，够看就行。
   ------------------------------------------------------------ */
const REPORT_CSS = `
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:#fff;color:#1a1a1a;line-height:1.65;max-width:820px;margin:0 auto;padding:40px 22px 80px}
header{border-bottom:2px solid #1a1a1a;padding-bottom:14px;margin-bottom:26px}
header h1{font-size:22px;font-weight:700;letter-spacing:.5px}
header .sub{font-size:12px;color:#666;margin-top:6px}
h1.stage{font-size:15px;font-weight:700;color:#0a6b7a;margin:34px 0 12px;padding-bottom:6px;border-bottom:1px solid #d8e3e6}
section{margin-bottom:24px}
section h2{font-size:14.5px;font-weight:600;margin-bottom:3px}
section .meta{font-size:11px;color:#888;margin-bottom:8px}
figure{margin:10px 0}
figure img{max-width:100%;border:1px solid #ddd;border-radius:6px;display:block}
figcaption{font-size:11px;color:#666;margin-bottom:5px}
blockquote{font-size:12.5px;background:#f6f8f9;border-left:3px solid #b8ccd2;padding:10px 13px;white-space:pre-wrap;border-radius:0 5px 5px 0}
p.file{font-size:12.5px;color:#333;margin:7px 0}
p.file span{color:#999;font-size:11px}
p.miss{font-size:12px;color:#b45050;margin:6px 0}
p.note{font-size:12px;color:#666;background:#fafafa;padding:8px 12px;border-radius:5px;margin-top:10px}
p.empty{color:#888;text-align:center;padding:60px 0}
@media print{body{padding:0}section{page-break-inside:avoid}}
`;

async function reportAttHtml(a, label){
  const cap = label ? '<figcaption>' + esc(label) + '</figcaption>' : '';
  if (a.kind === 'file'){
    if (a.attId && (a.mime || '').indexOf('image/') === 0){
      try {
        const b = await Files.get(a.attId);
        if (b){
          const du = await blobToDataURL(b);
          return '<figure>' + cap + '<img src="' + du + '" alt=""></figure>';
        }
      } catch(e){}
    }
    return '<p class="file">📎 ' + esc(a.name) + '　<span>' + fmtSize(a.size) + '</span></p>';
  }
  if (a.kind === 'link'){
    return '<p class="file">🔗 <a href="' + esc(a.url) + '" target="_blank" rel="noopener">' + esc(a.url) + '</a></p>';
  }
  return '<figure>' + (label ? '<figcaption>' + esc(label) + '</figcaption>' : '') +
    '<blockquote>' + esc(a.text || '') + '</blockquote></figure>';
}

async function buildReportHtml(){
  const parts = [];
  let files = 0;

  for (const st of STAGES){
    const rows = [];
    for (const c of (st.cells || [])){
      const rec = Store.data[c.id];
      if (!rec) continue;
      const atts = rec.atts || {};
      const keys = Object.keys(atts);
      if (!rec.done && !keys.length) continue;

      const items = c.items || [];
      let body = '';
      for (const it of items){
        const a = atts[it.id];
        if (!a){ body += '<p class="miss">✗ 没交：' + esc(it.t) + '</p>'; continue }
        body += await reportAttHtml(a, it.t);
        if (a.kind === 'file') files++;
      }
      for (const k of keys){
        if (items.some(it => it.id === k)) continue;
        body += await reportAttHtml(atts[k], '');
        if (atts[k].kind === 'file') files++;
      }
      if (rec.note) body += '<p class="note">' + esc(rec.note) + '</p>';

      rows.push('<section><h2>' + esc(c.id + '　' + c.t) + '</h2>' +
        '<p class="meta">' + (rec.done ? '已点亮 · ' + (rec.at || '') : '还没点亮') + '</p>' +
        body + '</section>');
    }
    if (rows.length) parts.push('<h1 class="stage">' + esc(st.id + ' · ' + st.name) + '</h1>' + rows.join(''));
  }

  const total = countDone(ALL);
  const html = '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">' +
    '<meta name="viewport" content="width=device-width,initial-scale=1">' +
    '<title>Jepson 造芯进度 · ' + today() + '</title><style>' + REPORT_CSS + '</style></head><body>' +
    '<header><h1>Jepson 的造芯进度</h1>' +
    '<p class="sub">导出时间 ' + today() + ' · 已点亮 ' + total + ' / ' + ALL.length + ' 格 · 共 ' + files + ' 个文件</p></header>' +
    (parts.length ? parts.join('') : '<p class="empty">还没有开始。第一格是 F2-01，装上 Logisim。</p>') +
    '</body></html>';
  return html;
}

async function exportReport(){
  toast('正在生成，图多的话要等几秒…');
  const html = await buildReportHtml();
  const blob = new Blob([html], {type:'text/html;charset=utf-8'});
  const a = document.createElement('a');
  const d = new Date();
  const name = '造芯进度报告_' + d.getFullYear() + ('0'+(d.getMonth()+1)).slice(-2) + ('0'+d.getDate()).slice(-2) + '.html';
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast('报告已导出：' + name);
}

function copyShare(){
  const done = countDone(ALL);
  const st = currentStage();
  const cur = st ? st.cells.find(c => !Store.isDone(c.id)) : null;
  const txt = 'Jepson 的造芯进度：点亮 ' + done + '/' + ALL.length + ' 格' +
              (cur ? '，正在做「' + cur.t + '」' : '，F 到 A 全点亮了');
  navigator.clipboard.writeText(txt).then(()=>toast('已复制，可以直接发群里')).catch(()=>toast('复制失败，换个浏览器试试'));
}

async function resetAll(){
  if (!confirm('清空所有进度和已交的图？清完找不回来，建议先「备份到文件」。')) return;
  for (const cellId in Store.data){
    const atts = Store.data[cellId].atts || {};
    for (const k in atts){
      if (atts[k].attId){ try { await Files.del(atts[k].attId) } catch(e){} }
    }
  }
  await Store.clearAll();
  onRoute();
  toast('已清空');
}

/* ============================================================
   启动
   ============================================================ */
function fitMap(){
  const sc = document.getElementById('mtScroll');
  const cv = document.getElementById('mtCanvas');
  if (!sc || !cv) return;
  const overflow = cv.offsetWidth - sc.clientWidth;
  if (overflow <= 4) { sc.scrollLeft = 0; return }
  // 六个点横跨的宽度在手机上放不进一屏，硬塞必然切掉一端。
  // 改成对准「你现在所在的这一站」——开局是 F（大本营），走起来自动跟着走。
  const cur = currentStage();
  const want = cur ? cur.id : 'A';
  const el = cv.querySelector('.hot[data-id="' + want + '"]');
  const w = cv.offsetWidth;
  let target;
  if (el){
    const x = w * parseFloat(el.style.left) / 100;
    target = x - sc.clientWidth / 2;
  } else {
    target = overflow / 2;
  }
  sc.scrollLeft = Math.max(0, Math.min(overflow, target));
}

(async function boot(){
  /* 选完文件就走这里：文件本体进 IndexedDB，元信息进进度数据 */
  document.getElementById('attFile').addEventListener('change', async function(){
    const f = this.files && this.files[0];
    const t = attTarget;
    attTarget = null;
    if (!f || !t) return;
    if (f.size > 12 * 1024 * 1024){
      toast('这个文件 ' + fmtSize(f.size) + '，超过 12MB。录屏截短一点，或者存到电脑上贴个链接。');
      return;
    }
    saveNoteNow();
    try {
      await Store.addFile(t.cellId, t.itemId, f);
      openSheet(t.cellId);
      toast('已交：' + f.name);
    } catch(e){
      toast('存不下，可能是浏览器空间满了');
    }
  });

  await Store.init();
  Store.listeners.push(()=>{});
  onRoute();
  fitMap();
  const img = document.getElementById('mtImg');
  if (img && !img.complete) img.addEventListener('load', fitMap, {once:true});
  window.addEventListener('resize', () => { if (location.hash === '') fitMap() });
})();
</script>
