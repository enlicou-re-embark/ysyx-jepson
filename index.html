<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B1120">
<title>Jepson 的造芯进度 · 一生一芯</title>
<meta name="description" content="从大本营走到峰顶，每点亮一格，离一颗真芯片近一点。">
<meta property="og:title" content="Jepson 的造芯进度">
<meta property="og:description" content="一生一芯 F 到 A，六段路，一格一格点亮。">
<meta property="og:type" content="website">
<style>
:root{
  --bg:#0A101C; --sf:#101A2C; --sf2:#16213A; --bd:#1D2A42; --bd2:#2A3A5C;
  --tx:#E8EFF9; --mu:#7E8EA6; --mu2:#5A6B85;
  --ac:#38BDF8; --ac2:#22D3EE; --ok:#34D399; --wn:#FBBF24; --gold:#F5A623;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--tx);
  font-family:system-ui,-apple-system,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  line-height:1.6; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
.wrap{max-width:900px;margin:0 auto;padding:0 18px}

/* ---------- 首页：山体 ---------- */
.hero{padding:26px 0 6px}
.hero h1{font-size:19px;font-weight:600;letter-spacing:.4px}
.hero .sub{font-size:12.5px;color:var(--mu);margin-top:5px;line-height:1.55}

.mt-outer{position:relative;margin-top:16px}
.mt-scroll{
  overflow-x:auto; overflow-y:hidden;
  -webkit-overflow-scrolling:touch; scrollbar-width:none;
  border-radius:14px;
}
.mt-scroll::-webkit-scrollbar{display:none}
.mt-canvas{position:relative;display:inline-block;line-height:0;width:100%}
.mt-canvas img{width:100%;height:auto;display:block;border-radius:14px}
.mt-scroll{background:linear-gradient(180deg,#132038,#0B1524);border-radius:14px}

.hot{
  position:absolute; transform:translate(-50%,-50%);
  width:42px;height:42px;border-radius:50%;
  border:none;background:transparent;cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;
  z-index:3;
}
.hot i{
  display:block;width:20px;height:20px;border-radius:50%;
  background:rgba(8,14,24,.5);
  border:2.5px solid #FFC85C;
  box-shadow:0 0 0 2px rgba(6,10,18,.55), 0 0 13px rgba(255,190,60,.75);
  transition:.22s;
}
.hot b{
  position:absolute; top:50%; left:calc(50% + 13px); transform:translateY(-50%);
  font-size:11px;font-weight:700;letter-spacing:.6px;line-height:1;
  color:#FFD98A;background:rgba(7,12,22,.8);
  padding:3px 7px;border-radius:6px;
  border:1px solid rgba(255,200,90,.32);
  white-space:nowrap;pointer-events:none;
}
.hot.l b{left:auto;right:calc(50% + 13px)}
.hot:hover i,.hot:focus-visible i{transform:scale(1.5);background:var(--gold);box-shadow:0 0 0 4px rgba(245,166,35,.28),0 0 20px rgba(245,166,35,.8)}
.hot.done i{background:var(--gold);box-shadow:0 0 0 3px rgba(245,166,35,.3),0 0 16px rgba(245,166,35,.65)}
.hot.cur i{animation:pulse 2.1s ease-in-out infinite}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 3px rgba(245,166,35,.18),0 0 12px rgba(245,166,35,.4)}
  50%{box-shadow:0 0 0 7px rgba(245,166,35,.05),0 0 22px rgba(245,166,35,.85)}
}
.mt-outer .hint-swipe{
  position:absolute;right:10px;bottom:8px;font-size:10px;line-height:1.4;color:rgba(255,255,255,.55);
  background:rgba(6,10,18,.6);padding:3px 8px;border-radius:99px;
  pointer-events:none;z-index:4;
}
@media (min-width:760px){ .mt-outer .hint-swipe{display:none} }

/* 手机：图撑到一定高度，超出部分横向拖动 */
@media (max-width:759px){
  .mt-canvas{width:auto}
  .mt-canvas img{width:auto;height:58vh;max-height:440px;border-radius:14px}
  .mt-scroll{border-radius:14px}
}

/* ---------- 进度条 ---------- */
.bar-wrap{margin-top:18px}
.bar-meta{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--mu);margin-bottom:7px}
.bar-meta b{color:var(--tx);font-weight:600;font-size:13px}
.bar{height:5px;background:var(--sf2);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;width:0;background:linear-gradient(90deg,#0E7490,var(--ac2));border-radius:99px;transition:width .55s cubic-bezier(.4,0,.2,1)}

/* ---------- 通用 ---------- */
section{padding:26px 0 0}
h2{font-size:12px;font-weight:600;color:var(--mu);letter-spacing:1.6px;text-transform:uppercase;margin-bottom:12px}
h2 span{color:var(--tx);font-weight:600;letter-spacing:.3px;text-transform:none;font-size:14px;margin-left:7px}

.today{display:grid;gap:9px}
.tcard{
  background:var(--sf);border:1px solid var(--bd);border-radius:13px;
  padding:14px 16px;cursor:pointer;transition:.16s;
  display:flex;gap:12px;align-items:flex-start;
}
.tcard:hover{border-color:var(--bd2);background:var(--sf2)}
.tcard .idx{
  flex:0 0 24px;height:24px;border-radius:7px;background:#0C2A38;color:var(--ac2);
  display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;
}
.tcard .body{flex:1;min-width:0}
.tcard .st{font-size:10.5px;color:var(--ac2);letter-spacing:.6px;margin-bottom:2px}
.tcard .tt{font-size:13.5px;font-weight:500;line-height:1.45}
.tcard .ds{font-size:11.5px;color:var(--mu);margin-top:3px;line-height:1.45}

/* ---------- 阶段页 ---------- */
#stageView{display:none}
#stageView.on{display:block}
#homeView.off{display:none}

.back{
  display:inline-flex;align-items:center;gap:6px;
  background:none;border:none;color:var(--mu);font-size:13px;
  cursor:pointer;padding:16px 0 4px;font-family:inherit;
}
.back:hover{color:var(--tx)}

.st-hd{padding:6px 0 20px}
.st-hd .tag{font-size:11px;color:var(--ac2);letter-spacing:1.4px;margin-bottom:6px}
.st-hd h1{font-size:23px;font-weight:600;letter-spacing:.3px}
.st-hd .meta{font-size:12.5px;color:var(--mu);margin-top:7px;line-height:1.6}

/* 海拔条 */
.alt{position:relative;margin:22px 0 8px;height:44px}
.alt-track{
  position:absolute;left:0;right:0;top:20px;height:4px;border-radius:99px;
  background:linear-gradient(90deg,#1B3A4B,#164E63 35%,#0E7490 70%,#F5A623);
  opacity:.55;
}
.alt-mark{
  position:absolute;top:20px;width:2px;height:4px;background:var(--bd2);
}
.alt-dot{
  position:absolute;top:22px;width:9px;height:9px;border-radius:50%;
  transform:translate(-50%,-50%);background:var(--sf2);border:1.5px solid var(--bd2);
}
.alt-dot.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 10px rgba(245,166,35,.7)}
.alt-lbl{
  position:absolute;top:4px;transform:translateX(-50%);
  font-size:10px;color:var(--mu2);letter-spacing:.5px;
}
.alt-lbl.on{color:var(--gold);font-weight:600}
.alt-pos{position:absolute;right:0;top:34px;font-size:10px;color:var(--mu2);display:none}

/* 节点列表 */
.list{display:grid;gap:8px;margin-top:8px}
.item{
  background:var(--sf);border:1px solid var(--bd);border-radius:12px;
  padding:13px 15px;cursor:pointer;transition:.16s;
  display:flex;gap:12px;align-items:flex-start;
}
.item:hover{border-color:var(--bd2);background:var(--sf2)}
.item.done{opacity:.55}
.item.done .it-t{text-decoration:line-through;text-decoration-color:var(--mu2)}
.it-n{
  flex:0 0 26px;height:26px;border-radius:8px;background:var(--sf2);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:var(--mu);
}
.item.done .it-n{background:#0F2E24;color:var(--ok)}
.it-b{flex:1;min-width:0}
.it-t{font-size:13.5px;font-weight:500;line-height:1.45}
.it-d{font-size:11.5px;color:var(--mu);margin-top:3px;line-height:1.45}
.chip{display:inline-block;font-size:10px;padding:1px 7px;border-radius:5px;background:#0C2A38;color:var(--ac2);margin-top:6px;letter-spacing:.3px}
.chip.warn{background:#2E2410;color:var(--wn)}

/* ---------- 弹层 ---------- */
#modal{
  position:fixed;inset:0;background:rgba(4,8,15,.84);backdrop-filter:blur(7px);
  display:none;align-items:flex-end;justify-content:center;z-index:99;
  padding:0;
}
#modal.on{display:flex}
@media (min-width:640px){ #modal{align-items:center;padding:24px} }
.sheet{
  background:var(--sf);border:1px solid var(--bd);
  border-radius:20px 20px 0 0;
  width:100%;max-width:540px;max-height:88vh;overflow-y:auto;
  padding:24px 22px calc(24px + env(safe-area-inset-bottom));
  animation:up .26s cubic-bezier(.2,.8,.3,1);
}
@media (min-width:640px){ .sheet{border-radius:18px} }
@keyframes up{from{transform:translateY(26px);opacity:0}to{transform:none;opacity:1}}
.grab{width:34px;height:4px;border-radius:99px;background:var(--bd2);margin:-8px auto 14px}
.sheet-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-hd h3{font-size:16.5px;font-weight:600;line-height:1.4}
.close{background:none;border:none;color:var(--mu);font-size:24px;cursor:pointer;padding:0 2px;line-height:1}
.sheet .stag{font-size:10.5px;color:var(--ac2);letter-spacing:1.1px;margin-top:6px}
.block{margin-top:18px}
.block .lb{font-size:10.5px;color:var(--mu);letter-spacing:1.2px;margin-bottom:6px}
.block .val{font-size:13.5px;line-height:1.65}
.block .val.out{background:#0C2A38;border-left:2px solid var(--ac2);padding:9px 13px;border-radius:0 8px 8px 0}
.block .val.stuck{color:var(--wn);font-size:12.5px}
textarea{
  width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:10px;
  color:var(--tx);padding:10px 12px;font-size:13px;font-family:inherit;
  resize:vertical;min-height:60px;margin-top:6px;line-height:1.6;
}
textarea:focus{outline:none;border-color:var(--ac2)}
textarea::placeholder{color:#3F5170}
.btn{
  border:none;border-radius:11px;padding:13px 20px;font-size:13.5px;font-weight:500;
  cursor:pointer;font-family:inherit;transition:.16s;width:100%;margin-top:14px;
}
.btn-main{background:var(--ac2);color:#04262E}
.btn-main:hover{background:#67E8F9}
.btn-done{background:#0F2E24;color:var(--ok);border:1px solid #1A4A3C}
.btn-ghost{background:transparent;color:var(--mu);border:1px solid var(--bd);width:auto;padding:8px 13px;font-size:11.5px;margin-top:0}
.btn-ghost:hover{color:var(--tx);border-color:var(--bd2)}
.note-done{font-size:12px;color:var(--ok);margin-top:12px;display:flex;gap:6px;align-items:center}
.note-done::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--ok)}

footer{border-top:1px solid var(--bd);margin-top:34px;padding:18px 0 30px;display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:11px;color:var(--mu2);line-height:1.75;margin-top:14px;padding-bottom:26px}

.toast{
  position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(12px);
  background:#152238;border:1px solid var(--bd2);color:var(--tx);
  padding:10px 18px;border-radius:11px;font-size:12.5px;z-index:200;
  opacity:0;pointer-events:none;transition:.24s;white-space:nowrap;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- 里程碑弹句 ---------- */
.cheer{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(22px) scale(.97);
  width:calc(100% - 40px);max-width:440px;z-index:210;
  opacity:0;pointer-events:none;transition:.34s cubic-bezier(.22,1.2,.36,1);
}
.cheer.on{opacity:1;transform:translateX(-50%) translateY(0) scale(1);pointer-events:auto}
.cheer-in{
  position:relative;overflow:hidden;
  background:linear-gradient(150deg,#1A2233,#101724 62%);
  border:1px solid rgba(245,166,35,.34);
  border-radius:15px;padding:15px 17px 15px 18px;
  box-shadow:0 16px 44px rgba(0,0,0,.62),0 0 0 1px rgba(245,166,35,.06),inset 0 1px 0 rgba(255,255,255,.05);
}
.cheer-in::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,#F5A623,#FFD98A);opacity:.9;
}
.cheer-in::after{
  content:'';position:absolute;right:-40px;top:-50px;width:130px;height:130px;border-radius:50%;
  background:radial-gradient(circle,rgba(245,166,35,.13),transparent 70%);pointer-events:none;
}
.cheer-tag{
  font-size:10px;letter-spacing:1.4px;color:#E0A34A;font-weight:700;
  text-transform:uppercase;margin-bottom:7px;
}
.cheer-tx{font-size:13.5px;line-height:1.72;color:#EAF0F8;letter-spacing:.2px}
.cheer-close{
  position:absolute;right:6px;top:6px;width:26px;height:26px;border:none;border-radius:8px;
  background:transparent;color:#7C8CA6;font-size:15px;line-height:1;cursor:pointer;
}
.cheer-close:hover{background:rgba(255,255,255,.06);color:#C6D3E5}
@media (max-width:480px){
  .cheer{bottom:20px;width:calc(100% - 28px)}
  .cheer-tx{font-size:13px}
}
</style>
</head>
<body>

<div class="wrap" id="homeView">
  <div class="hero">
    <h1>Jepson 的造芯进度</h1>
    <div class="sub">从大本营走到峰顶。每点亮一格，离一颗真芯片近一点。</div>
  </div>

  <div class="mt-outer">
    <div class="mt-scroll" id="mtScroll">
      <div class="mt-canvas" id="mtCanvas">
        <picture>
          <source srcset="assets/route_1600.webp" type="image/webp">
          <img src="assets/route_1600.jpg" alt="珠峰路线图" id="mtImg">
        </picture>
      </div>
    </div>
    <div class="hint-swipe">← 左右拖动 →</div>
  </div>

  <div class="bar-wrap">
    <div class="bar-meta">
      <span id="progText">0 / 0</span>
      <b id="progPct">0%</b>
    </div>
    <div class="bar"><div class="bar-fill" id="progBar"></div></div>
  </div>

  <section>
    <h2>今天可以做的<span>三件</span></h2>
    <div class="today" id="today"></div>
  </section>

  <section>
    <h2>六个阶段<span id="stageCount"></span></h2>
    <div class="list" id="stageList"></div>
  </section>

  <footer>
    <button class="btn-ghost" onclick="exportJSON()">备份到文件</button>
    <button class="btn-ghost" onclick="document.getElementById('imp').click()">从文件恢复</button>
    <button class="btn-ghost" onclick="copyShare()">复制一句话发群里</button>
    <button class="btn-ghost" style="margin-left:auto" onclick="resetAll()">清空</button>
    <input type="file" id="imp" accept=".json" style="display:none" onchange="importJSON(this)">
  </footer>
  <div class="hint">
    进度存在这台设备的浏览器里，换设备不会自动同步——要换设备就先用「备份到文件」导出，再在新设备上「从文件恢复」。<br>
    截图不要存在这里。自己在电脑上建个文件夹，按编号命名，比如 F3-04.png。一年后能拿出来的，是那个文件夹。
  </div>
</div>

<div class="wrap" id="stageView">
  <button class="back" onclick="go('')">← 回到路线</button>
  <div id="stageBody"></div>
</div>

<div id="modal" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>

<div class="toast" id="toast"></div>

<div class="cheer" id="cheer" onclick="if(event.target.id!=='cheerClose')hideCheer()">
  <div class="cheer-in">
    <button class="cheer-close" id="cheerClose" onclick="event.stopPropagation();hideCheer()">×</button>
    <div class="cheer-tag" id="cheerTag"></div>
    <div class="cheer-tx" id="cheerTx"></div>
  </div>
</div>

<script>
/* ============================================================
   数据层：与界面分离，将来换云端只动 Store 一个对象
   ------------------------------------------------------------
   现在：localStorage
   将来：把 Store.init / Store.persist 换成 Supabase 调用即可，
        所有 UI 都已经是 await 调用，调用点不用改。
   ============================================================ */
const SCHEMA = 1;
const KEY = 'ysyx_progress_v1';

const Store = {
  backend: 'local',          // 'local' | 'cloud'，将来切云时改这里
  data: {},
  listeners: [],

  async init(){
    if (this.backend === 'cloud') {
      // 预留：this.data = await Cloud.load()
    }
    try {
      const raw = localStorage.getItem(KEY);
      const parsed = raw ? JSON.parse(raw) : null;
      this.data = (parsed && parsed.schema === SCHEMA) ? parsed.cells : {};
    } catch(e) { this.data = {}; }
  },

  /* 唯一的写入口：将来云端在这里发请求，失败可回滚 */
  async persist(){
    const payload = { schema: SCHEMA, updatedAt: new Date().toISOString(), cells: this.data };
    if (this.backend === 'cloud') {
      // 预留：await Cloud.save(payload)
    }
    try { localStorage.setItem(KEY, JSON.stringify(payload)); } catch(e){}
    this.listeners.forEach(fn => fn());
  },

  get(id){ return this.data[id] || null },
  isDone(id){ return !!this.data[id]?.done },
  note(id){ return this.data[id]?.note || '' },

  async setDone(id, done, note){
    if (done){
      this.data[id] = { done:true, note: note ?? this.note(id), at: this.data[id]?.at || today() };
    } else {
      delete this.data[id];
    }
    await this.persist();
  },

  async setNote(id, note){
    if (!this.data[id]) return;
    this.data[id].note = note;
    await this.persist();
  },

  dump(){ return { schema: SCHEMA, updatedAt: new Date().toISOString(), cells: this.data } },

  async load(obj){
    if (!obj || typeof obj !== 'object') throw new Error('bad file');
    const cells = obj.cells || obj;
    this.data = {};
    for (const k in cells){
      const v = cells[k];
      if (v && (v.done || v.note)) this.data[k] = { done: !!v.done, note: v.note || '', at: v.at || '' };
    }
    await this.persist();
  }
};

/* ============================================================
   课程内容
   ============================================================ */
const F_CELLS = [
  {id:'F1-01', t:'读完两篇讲提问的文章', d:'讲义里指定的两篇，讲怎么问别人才愿意答', out:'一句话：你以前问过的最糟糕的问题是什么，为什么没人回', type:'文字', min:40, stuck:'读不下去就只读标题和小标题，知道有这回事就行，不用逐字。'},
  {id:'F1-02', t:'写一篇不少于 800 字的读后感', d:'就着上面两篇写，写你自己踩过的坑最省力', out:'一篇 800 字以上的文字', type:'文字', min:90, stuck:'写之前先列三行提纲：我以前的问法 / 别人为什么不回 / 我以后怎么改。凑够三层就有 800 字。'},
  {id:'F1-03', t:'通识问卷做到 100 分', d:'入学答辩的硬门槛，很多人到最后才发现', out:'一张 100 分的截图', type:'截图', min:30, stuck:'可以无限重做。第一次故意做错，把错题抄下来，第二次就过了。'},
  {id:'F2-01', t:'装上 Logisim，打开看一眼', d:'目标不是学会用，是让它能打开', out:'一张软件主界面的截图', type:'截图', min:40, stuck:'双击没反应，多半是缺 Java。先装 JDK，或者找自带 Java 的版本。这一步卡住的人最多，不是你笨。'},
  {id:'F2-02', t:'点亮一个灯', d:'拖一个输入、一个输出，连一根线', out:'灯亮的截图或 3 秒录屏', type:'截图', min:30, stuck:'找不到元件就点左侧的文件夹图标，里面按类别分好了。'},

function today(){
  const d = new Date();
  return (d.getMonth()+1) + '月' + d.getDate() + '日';
}
function stageOf(cellId){
  return STAGES.find(s => s.cells.some(c => c.id === cellId));
}
function countDone(cells){ return cells.filter(c => Store.isDone(c.id)).length }
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove('on'), 2000);
}

/* 里程碑弹句 */
let cheerTimer = null;
function showCheer(tag, text){
  const box = document.getElementById('cheer');
  if (!box) return;
  document.getElementById('cheerTag').textContent = tag;
  document.getElementById('cheerTx').textContent = text;
  box.classList.add('on');
  clearTimeout(cheerTimer);
  cheerTimer = setTimeout(hideCheer, 7000);
}
function hideCheer(){
  const box = document.getElementById('cheer');
  if (box) box.classList.remove('on');
  clearTimeout(cheerTimer);
}

function milestoneHit(stage, before, after){
  const n = stage.cells.length;
  if (!n || after <= before) return null;
  const t30 = Math.max(2, Math.ceil(n * 0.3));
  const t80 = Math.min(n - 1, Math.max(t30 + 1, Math.ceil(n * 0.8)));
  if (after === n) return 'p100';
  if (after === 1) return 'first';        // 第一格单独一句话
  if (after === t80) return 'p80';
  if (after === t30) return 'p30';
  return null;
}
function esc(s){ return String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])) }

/* ============================================================
   渲染：首页
   ============================================================ */
function renderHome(){
  // 热区
  const canvas = document.getElementById('mtCanvas');
  canvas.querySelectorAll('.hot').forEach(n => n.remove());
  STAGES.forEach(s => {
    const doneN = countDone(s.cells);
    const isDone = doneN === s.cells.length;
    const isCur = currentStage()?.id === s.id;
    const btn = document.createElement('button');
    btn.className = 'hot' + (isDone ? ' done' : '') + (isCur ? ' cur' : '') + (s.side === 'l' ? ' l' : '');
    btn.style.left = s.x + '%';
    btn.style.top = s.y + '%';
    btn.setAttribute('aria-label', s.name);
    btn.dataset.id = s.id;
    btn.innerHTML = '<i></i><b>' + s.short + '</b>';
    btn.onclick = () => go(s.id);
    canvas.appendChild(btn);
  });

  // 总进度
  const done = countDone(ALL), total = ALL.length;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('progText').textContent = done + ' / ' + total + ' 格';
  document.getElementById('progPct').textContent = pct + '%';
  document.getElementById('progBar').style.width = pct + '%';

  // 今天三件
  const curStage = currentStage();
  const picks = curStage ? curStage.cells.filter(c => !Store.isDone(c.id)).slice(0, 3) : [];
  const todayEl = document.getElementById('today');
  if (!picks.length){
    todayEl.innerHTML = '<div class="tcard" style="cursor:default"><div class="body">' +
      '<div class="tt">F 到 A 的格子都点亮了。</div>' +
      '<div class="ds">下一步是准备入学答辩。找社团群里的助教要清单。</div></div></div>';
  } else {
    todayEl.innerHTML = picks.map((c, i) =>
      '<div class="tcard" onclick="openSheet(\'' + c.id + '\')">' +
        '<div class="idx">' + (i+1) + '</div>' +
        '<div class="body"><div class="st">' + curStage.id + '</div>' +
        '<div class="tt">' + esc(c.t) + '</div>' +
        '<div class="ds">交：' + esc(c.out) + '</div></div></div>'
    ).join('');
  }

  // 阶段列表
  const sl = document.getElementById('stageList');
  sl.innerHTML = STAGES.map(s => {
    const d = countDone(s.cells), n = s.cells.length;
    const isCur = curStage?.id === s.id;
    return '<div class="item' + (d === n ? ' done' : '') + '" onclick="go(\'' + s.id + '\')">' +
      '<div class="it-n"' + (isCur ? ' style="background:#12283B;color:#38BDF8"' : '') + '>' + s.short + '</div>' +
      '<div class="it-b"><div class="it-t">' + esc(s.desc) + '</div>' +
      '<span class="chip">' + d + ' / ' + n + '</span>' +
      '<span class="chip" style="margin-left:6px">' + s.hours + '</span></div></div>';
  }).join('');
}

function currentStage(){
  for (const s of STAGES) if (s.cells.some(c => !Store.isDone(c.id))) return s;
  return null;
}

/* ============================================================
   渲染：阶段页
   ============================================================ */
function renderStage(id){
  const s = STAGES.find(x => x.id === id);
  if (!s) { go(''); return }
  const idx = STAGES.indexOf(s);
  const d = countDone(s.cells), n = s.cells.length;

  const alt = STAGES.map((x, i) => {
    const left = 6 + (i / (STAGES.length - 1)) * 88;
    const on = x.id === s.id;
    return '<div class="alt-lbl' + (on?' on':'') + '" style="left:' + left + '%">' + x.short + '</div>' +
           '<div class="alt-dot' + (on?' on':'') + '" style="left:' + left + '%"></div>';
  }).join('');

  const items = s.cells.map((c, i) => {
    const done = Store.isDone(c.id);
    const nt = Store.note(c.id);
    return '<div class="item' + (done?' done':'') + '" onclick="openSheet(\'' + c.id + '\')">' +
      '<div class="it-n">' + (done ? '✓' : (i+1)) + '</div>' +
      '<div class="it-b"><div class="it-t">' + esc(c.t) + '</div>' +
      '<div class="it-d">' + esc(c.d) + '</div>' +
      '<span class="chip' + (c.type==='方向'?' warn':'') + '">' + c.type + (c.min ? ' · 约' + c.min + '分钟' : '') + '</span>' +
      (nt ? '<div class="it-d" style="margin-top:6px;color:#9DB0C9">「' + esc(nt) + '」</div>' : '') +
      '</div></div>';
  }).join('');

  document.getElementById('stageBody').innerHTML =
    '<div class="st-hd"><div class="tag">' + esc(s.tag) + '</div>' +
    '<h1>' + esc(s.name) + '</h1>' +
    '<div class="meta">' + esc(s.desc) + '</div></div>' +
    '<div class="alt"><div class="alt-track"></div>' + alt + '</div>' +
    '<div class="bar-wrap" style="margin-top:6px">' +
      '<div class="bar-meta"><span>第 ' + (idx+1) + ' / ' + STAGES.length + ' 站 · ' + d + ' / ' + n + ' 格</span><b>' + (n?Math.round(d/n*100):0) + '%</b></div>' +
      '<div class="bar"><div class="bar-fill" style="width:' + (n?Math.round(d/n*100):0) + '%"></div></div>' +
    '</div>' +
    (s.note ? '<div class="hint" style="margin-top:14px;color:#8496AE">' + esc(s.note) + '</div>' : '') +
    '<div class="list">' + items + '</div>';
}

/* ============================================================
   路由
   ============================================================ */
function go(id){
  if (id){
    location.hash = '#/' + id;
  } else {
    location.hash = '';
  }
}
function onRoute(){
  const m = location.hash.match(/^#\/([A-Z])$/);
  if (m){
    document.getElementById('homeView').classList.add('off');
    document.getElementById('stageView').classList.add('on');
    renderStage(m[1]);
    window.scrollTo(0, 0);
  } else {
    document.getElementById('stageView').classList.remove('on');
    document.getElementById('homeView').classList.remove('off');
    renderHome();
  }
}
window.addEventListener('hashchange', onRoute);

/* ============================================================
   弹层
   ============================================================ */
let sheetId = null;
function openSheet(id){
  const c = ALL.find(x => x.id === id);
  if (!c) return;
  hideCheer();
  sheetId = id;
  const s = stageOf(id);
  const done = Store.isDone(id);
  const nt = Store.note(id);
  const rec = Store.data[id];
  document.getElementById('sheet').innerHTML =
    '<div class="grab"></div>' +
    '<div class="sheet-hd"><h3>' + esc(c.t) + '</h3>' +
    '<button class="close" onclick="closeSheet()">×</button></div>' +
    '<div class="stag">' + s.id + ' · ' + esc(s.name) + '</div>' +
    '<div class="block"><div class="lb">这一步做什么</div><div class="val">' + esc(c.d) + '</div></div>' +
    '<div class="block"><div class="lb">交什么才算过</div><div class="val out">' + esc(c.out) + '</div></div>' +
    '<div class="block"><div class="lb">大概要多久</div><div class="val">' + (c.min ? '约 ' + c.min + ' 分钟' : '待定') + '</div></div>' +
    '<div class="block"><div class="lb">卡住了怎么过</div><div class="val stuck">' + esc(c.stuck) + '</div></div>' +
    '<div class="block"><div class="lb">留一句给自己（可选）</div>' +
    '<textarea id="note" placeholder="哪一步最费劲、下次怎么绕过、想吐槽什么">' + esc(nt) + '</textarea></div>' +
    (done
      ? '<div class="note-done">这格已经点亮了' + (rec?.at ? ' · ' + rec.at : '') + '</div>' +
        '<button class="btn btn-done" onclick="toggleDone(\'' + id + '\', true)">取消点亮</button>'
      : '<button class="btn btn-main" onclick="toggleDone(\'' + id + '\', false)">点亮这一格</button>');
  document.getElementById('modal').classList.add('on');
  document.body.style.overflow = 'hidden';
}
function closeSheet(){
  document.getElementById('modal').classList.remove('on');
  document.body.style.overflow = '';
  sheetId = null;
}
async function toggleDone(id, wasDone){
  const noteEl = document.getElementById('note');
  const note = noteEl ? noteEl.value.trim() : '';
  const st = stageOf(id);
  const before = st ? countDone(st.cells) : 0;
  await Store.setDone(id, !wasDone, note);
  closeSheet();
  onRoute();
  if (wasDone){ toast('已取消点亮'); return }
  const after = st ? countDone(st.cells) : 0;
  const key = st ? milestoneHit(st, before, after) : null;
  const msg = key ? (MILESTONE[st.id] || {})[key] : null;
  if (msg){
    showCheer(st.id + ' 段 · ' + MS_LABEL[key], msg);
  } else {
    toast('点亮了');
  }
}

/* ============================================================
   导入导出
   ============================================================ */
function exportJSON(){
  const blob = new Blob([JSON.stringify(Store.dump(), null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  const d = new Date();
  const name = 'Jepson造芯进度_' + d.getFullYear() + ('0'+(d.getMonth()+1)).slice(-2) + ('0'+d.getDate()).slice(-2) + '.json';
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast('已导出：' + name);
}

async function importJSON(input){
  const f = input.files[0];
  if (!f) return;
  try {
    const txt = await f.text();
    await Store.load(JSON.parse(txt));
    onRoute();
    toast('已恢复进度');
  } catch(e){
    toast('这个文件读不出来');
  }
  input.value = '';
}

function copyShare(){
  const done = countDone(ALL);
  const st = currentStage();
  const cur = st ? st.cells.find(c => !Store.isDone(c.id)) : null;
  const txt = 'Jepson 的造芯进度：点亮 ' + done + '/' + ALL.length + ' 格' +
              (cur ? '，正在做「' + cur.t + '」' : '，F 到 A 全点亮了');
  navigator.clipboard.writeText(txt).then(()=>toast('已复制，可以直接发群里')).catch(()=>toast('复制失败，换个浏览器试试'));
}

async function resetAll(){
  if (!confirm('清空所有进度？清完找不回来，建议先「备份到文件」。')) return;
  Store.data = {};
  await Store.persist();
  onRoute();
  toast('已清空');
}

/* ============================================================
   启动
   ============================================================ */
function fitMap(){
  const sc = document.getElementById('mtScroll');
  const cv = document.getElementById('mtCanvas');
  if (!sc || !cv) return;
  const overflow = cv.offsetWidth - sc.clientWidth;
  if (overflow <= 4) { sc.scrollLeft = 0; return }
  // 六个点横跨的宽度在手机上放不进一屏，硬塞必然切掉一端。
  // 改成对准「你现在所在的这一站」——开局是 F（大本营），走起来自动跟着走。
  const cur = currentStage();
  const want = cur ? cur.id : 'A';
  const el = cv.querySelector('.hot[data-id="' + want + '"]');
  const w = cv.offsetWidth;
  let target;
  if (el){
    const x = w * parseFloat(el.style.left) / 100;
    target = x - sc.clientWidth / 2;
  } else {
    target = overflow / 2;
  }
  sc.scrollLeft = Math.max(0, Math.min(overflow, target));
}

(async function boot(){
  await Store.init();
  Store.listeners.push(()=>{});
  onRoute();
  fitMap();
  const img = document.getElementById('mtImg');
  if (img && !img.complete) img.addEventListener('load', fitMap, {once:true});
  window.addEventListener('resize', () => { if (location.hash === '') fitMap() });
})();
</script>
